databases:
  - name: eduquest-ap2-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: eduquest-ap2
    runtime: docker
    plan: free
    repo: https://github.com/mayaracunha-beep/dsai-ap2-eduquest
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduquest-ap2-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_EXPIRATION_MINUTES
        value: "60"
      - key: RESET_TOKEN_EXPIRATION_MINUTES
        value: "60"
